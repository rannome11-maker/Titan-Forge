name: Build Sentinel APK

on:
  push:
    branches: [sentinel-app]
    paths:
      - "Sentinel/**"
      - ".github/workflows/build-sentinel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        working-directory: Sentinel
        run: gradle :app:assembleRelease --stacktrace
      - name: Package
        run: |
          mkdir -p output
          cp Sentinel/app/build/outputs/apk/release/app-release.apk output/BlackForge_Sentinel_v1.0.0.apk
          sha256sum output/BlackForge_Sentinel_v1.0.0.apk > output/BlackForge_Sentinel_v1.0.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BlackForge-Sentinel-APK
          path: output/*
          retention-days: 30
