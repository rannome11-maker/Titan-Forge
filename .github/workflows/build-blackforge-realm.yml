name: Build BlackForge Realm APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: realm } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: BlackForge-Realm-APK
          path: realm/app/build/outputs/apk/release/app-release.apk
