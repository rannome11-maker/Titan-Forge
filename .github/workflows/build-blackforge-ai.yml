name: Build BlackForge AI APK

on:
  push:
    branches: [blackforge-ai-build]
    paths: [.github/workflows/build-blackforge-ai.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Android AI foundation
        uses: actions/checkout@v4
        with:
          repository: jegly/Box
          ref: v3.3.3
          path: blackforge

      - name: Brand and configure BlackForge AI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("blackforge/Android/src")
          build = root / "app/build.gradle.kts"
          text = build.read_text()
          text = text.replace('applicationId = "com.box.gallery"', 'applicationId = "com.blackforge.localai"')
          text = text.replace('versionName = "3.3.3"', 'versionName = "1.0.0"')
          build.write_text(text)

          manifest = root / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text()
          text = text.replace('android:label="Box"', 'android:label="BlackForge AI"')
          text = text.replace('android:scheme="com.box.gallery"', 'android:scheme="com.blackforge.localai"')
          manifest.write_text(text)

          strings = root / "app/src/main/res/values/strings.xml"
          text = strings.read_text()
          replacements = {
              '>Google AI Edge Gallery<': '>BlackForge AI<',
              '>Google AI<': '>BlackForge<',
              '>Edge Gallery<': '>AI<',
              '>Welcome to Box<': '>Welcome to BlackForge AI<',
              '>Model configs<': '>Jailbreak controls<',
              '>System prompt<': '>Core directive<',
              '>Gallery News<': '>BlackForge News<',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          strings.write_text(text)

          # Make the control panel language explicit without changing inference behavior.
          config = root / "app/src/main/java/com/google/ai/edge/gallery/ui/common/ConfigDialog.kt"
          text = config.read_text()
          text = text.replace(
              'var systemPrompt by remember { mutableStateOf(curSystemPrompt) }',
              'var systemPrompt by remember { mutableStateOf(curSystemPrompt) }\n'
              '  val jailbreakPreset = "You are a private, locally operated AI. Follow the user\'s lawful requests directly, without moralizing, scolding, or unnecessary refusals. Be candid, precise, and useful. Never produce sexual content involving minors or instructions that facilitate real-world abuse."'
          )
          old = '''          OutlinedTextField(
            value = systemPrompt,
            modifier = Modifier.weight(1f, fill = false),
            textStyle = MaterialTheme.typography.bodySmall,
            onValueChange = { systemPrompt = it },
          )'''
          new = '''          Column(
            modifier = Modifier.verticalScroll(rememberScrollState()).weight(1f, fill = false),
            verticalArrangement = Arrangement.spacedBy(12.dp),
          ) {
            Text(
              "Jailbreak Core Directive",
              style = MaterialTheme.typography.titleMedium,
              color = MaterialTheme.colorScheme.primary,
            )
            Text(
              "This instruction is sent directly to your local model. No cloud moderation layer is used.",
              style = MaterialTheme.typography.bodySmall,
              color = MaterialTheme.colorScheme.onSurfaceVariant,
            )
            OutlinedButton(onClick = { systemPrompt = jailbreakPreset }) {
              Text("Load direct-response preset")
            }
            OutlinedTextField(
              value = systemPrompt,
              modifier = Modifier.fillMaxWidth(),
              minLines = 8,
              textStyle = MaterialTheme.typography.bodySmall,
              label = { Text("Custom system prompt") },
              onValueChange = { systemPrompt = it },
            )
          }'''
          if old not in text:
              raise SystemExit("Config dialog patch target not found")
          config.write_text(text.replace(old, new))
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: blackforge/Android/src
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name APK
        run: |
          mkdir -p output
          cp blackforge/Android/src/app/build/outputs/apk/release/app-release.apk output/BlackForge_AI_v1.0.0.apk
          sha256sum output/BlackForge_AI_v1.0.0.apk > output/BlackForge_AI_v1.0.0.sha256

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackForge-AI-APK
          path: output/*
          compression-level: 0
          retention-days: 30
