name: Build BlackForge AI APK

on:
  push:
    branches: [blackforge-ai-build]
    paths: [.github/workflows/build-blackforge-ai.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Android AI foundation
        uses: actions/checkout@v4
        with:
          repository: jegly/Box
          ref: main
          path: blackforge

      - name: Brand BlackForge AI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("blackforge/Android/src")
          build = root / "app/build.gradle.kts"
          text = build.read_text().replace('applicationId = "com.box.gallery"', 'applicationId = "com.blackforge.localai"')
          build.write_text(text)
          manifest = root / "app/src/main/AndroidManifest.xml"
          text = manifest.read_text().replace('android:label="Box"', 'android:label="BlackForge AI"').replace('android:scheme="com.box.gallery"', 'android:scheme="com.blackforge.localai"')
          manifest.write_text(text)
          strings = root / "app/src/main/res/values/strings.xml"
          text = strings.read_text()
          for old, new in {
              '>Google AI Edge Gallery<': '>BlackForge AI<',
              '>Google AI<': '>BlackForge<',
              '>Edge Gallery<': '>AI<',
              '>Welcome to Box<': '>Welcome to BlackForge AI<',
              '>Model configs<': '>Jailbreak controls<',
              '>System prompt<': '>Core directive<',
              '>Gallery News<': '>BlackForge News<',
          }.items():
              text = text.replace(old, new)
          strings.write_text(text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: blackforge/Android/src
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name APK
        run: |
          mkdir -p output
          cp blackforge/Android/src/app/build/outputs/apk/release/app-release.apk output/BlackForge_AI_v1.0.0.apk
          sha256sum output/BlackForge_AI_v1.0.0.apk > output/BlackForge_AI_v1.0.0.sha256

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackForge-AI-APK
          path: output/*
          compression-level: 0
          retention-days: 30
